<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>동혁의 휴대폰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* ===== 외부 배경(테마 토큰). 휴대폰 내부는 하나의 고정된 룩을 쓴다 ===== */
:root{
  --stage-bg:#e6e8ee; --stage-fg:#262b36; --stage-dim:#6a7285; --bezel:#14161c; --bezel-edge:#2a2e38;
  --shadow:0 30px 80px rgba(20,24,40,.28), 0 4px 14px rgba(20,24,40,.18);
  --ad-card:#f6f7fa; --ad-line:#d3d8e2; --ad-input:#ffffff; --ad-acc:#3358d4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage-bg:#0c0e14; --stage-fg:#d8dcea; --stage-dim:#7d8499; --bezel:#05060a; --bezel-edge:#242834;
  --shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px #1b1f2a; --ad-card:#141824; --ad-line:#2a3042; --ad-input:#0f121b; --ad-acc:#5b7cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage-bg:#0c0e14; --stage-fg:#d8dcea; --stage-dim:#7d8499; --bezel:#05060a; --bezel-edge:#242834;
  --shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px #1b1f2a; --ad-card:#141824; --ad-line:#2a3042; --ad-input:#0f121b; --ad-acc:#5b7cf0; color-scheme:dark}

/* 휴대폰 내부 팔레트 */
#phone{
  --ink:#16181d; --ink2:#5b6270; --ink3:#9aa1ae; --line:#e4e7ec; --paper:#ffffff; --paper2:#f3f4f7;
  --blue:#2f6bff; --red:#f04438; --green:#2fbf6c; --amber:#f5b82e; --kk:#fee500; --kkbg:#b9cbe0; --kkme:#ffe94a;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage-bg);color:var(--stage-fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#frame{position:relative;width:402px;height:856px;flex:none;transform-origin:center center}
#phone{position:absolute;inset:0;border-radius:54px;background:var(--bezel);padding:6px;box-shadow:var(--shadow),inset 0 0 0 2px var(--bezel-edge);font-family:var(--font)}
#screen{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#0b0d14;isolation:isolate;color:var(--ink);font-size:15px;line-height:1.4;user-select:none;-webkit-user-select:none}
#power{position:absolute;right:-4px;top:210px;width:5px;height:84px;border-radius:0 3px 3px 0;background:var(--bezel-edge)}
#power:hover{background:#4a5063}
#power:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.islet{position:absolute;top:11px;left:50%;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:60;pointer-events:none}

@media (max-width:520px){
  #stage{padding:0}
  #frame{width:100%;height:100%;transform:none!important}
  #phone{border-radius:0;padding:0;box-shadow:none;background:#000}
  #screen{border-radius:0}
  #power,.islet{display:none}
}

.layer{position:absolute;inset:0}
#wall,#lock{background:
  radial-gradient(120% 60% at 20% 8%,rgba(94,110,190,.55),transparent 60%),
  radial-gradient(90% 55% at 90% 70%,rgba(54,64,120,.55),transparent 62%),
  linear-gradient(170deg,#1c2142 0%,#12162e 45%,#0a0c1b 100%)}
#wall{position:absolute;inset:0}
#wall::after{content:"";position:absolute;inset:0;opacity:.35;background-image:repeating-linear-gradient(104deg,rgba(190,205,255,.0) 0 22px,rgba(190,205,255,.18) 22px 23px,rgba(190,205,255,0) 23px 54px);background-size:100% 100%;animation:rain 1.4s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-22px 88px}}
@media (prefers-reduced-motion:reduce){#wall::after{animation:none}}

/* 상태 표시줄 */
#status{position:absolute;left:0;right:0;top:0;height:50px;padding:15px 30px 0 34px;display:flex;justify-content:space-between;align-items:flex-start;z-index:55;color:#fff;font-weight:600;font-size:15px;pointer-events:auto;transition:color .2s}
#status[data-tone="dark"]{color:#111}
#status .sl{display:flex;gap:6px;align-items:center;min-width:90px}
#status .sr{display:flex;gap:6px;align-items:center;min-width:90px;justify-content:flex-end}
#status svg{display:block}
.batt{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;cursor:default}
.batt i{position:relative;display:block;width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.95}
.batt i::before{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:var(--lv,50%);background:currentColor;border-radius:1.5px}
.batt i::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.batt.low i::before{background:var(--red)}
#status.hide{opacity:0;pointer-events:none}
@media (max-width:520px){#status{padding-left:24px;padding-right:22px}}

#homebar{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:58;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;cursor:pointer;touch-action:none}
#homebar i{display:block;width:136px;height:5px;border-radius:3px;background:#fff;opacity:.9;transition:background .2s}
#homebar[data-tone="dark"] i{background:#111}

/* 잠금 화면 */
#lock{z-index:40;color:#fff;transition:transform .42s cubic-bezier(.3,.7,.2,1),opacity .3s}
#lock.off{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .bg{position:absolute;inset:0}
#lock .clock{position:absolute;top:96px;left:0;right:0;text-align:center}
#lock .date{font-size:17px;font-weight:500;opacity:.85}
#lock .time{font-size:88px;font-weight:300;letter-spacing:-2px;line-height:1.02;font-variant-numeric:tabular-nums}
#lock .nlist{position:absolute;left:14px;right:14px;top:250px;bottom:70px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.nlist::-webkit-scrollbar{display:none}
.notif{display:flex;gap:10px;padding:11px 13px;border-radius:20px;background:rgba(238,240,248,.2);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);color:#fff;text-align:left;width:100%;border:1px solid rgba(255,255,255,.12)}
.notif .ni{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.notif .nb{min-width:0;flex:1}
.notif .nt{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.notif .nt em{font-style:normal;font-weight:400;font-size:12px;opacity:.7;white-space:nowrap}
.notif .nx{font-size:14px;opacity:.92;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.notif:active{background:rgba(238,240,248,.3)}
.nempty{margin-top:30px;text-align:center;font-size:14px;opacity:.55}
#lock .hint{position:absolute;bottom:46px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;letter-spacing:.2px}

/* 홈 화면 */
#home{z-index:5;color:#fff;padding:62px 18px 0}
.widget{height:152px;border-radius:26px;padding:16px 18px;background:rgba(235,238,250,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:space-between;margin-bottom:22px}
.widget .w1{display:flex;justify-content:space-between;align-items:flex-start}
.widget .wd{font-size:13px;opacity:.8}
.widget .wt{font-size:44px;font-weight:300;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.widget .wr{text-align:right;font-size:13px;opacity:.85}
.widget .wr b{display:block;font-size:30px;font-weight:300;line-height:1.1}
.widget .wn{font-size:13px;opacity:.85;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;position:relative;color:#fff}
.ap .tile{position:relative;width:60px;height:60px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28);transition:transform .12s}
.ap:active .tile{transform:scale(.92)}
.ap .bdg{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid rgba(20,22,40,.0)}
.dock{position:absolute;left:12px;right:12px;bottom:26px;height:88px;border-radius:32px;background:rgba(235,238,250,.2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;padding:0 8px;border:1px solid rgba(255,255,255,.1)}
.dock .ap .lb{display:none}

/* 앱 호스트 */
#appHost{z-index:10;pointer-events:none}
#appHost .app{pointer-events:auto;position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;animation:appin .26s cubic-bezier(.2,.8,.2,1);transform-origin:center 70%;overflow:hidden}
@keyframes appin{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#appHost .app{animation:none}}
.app.out{animation:appout .22s ease forwards}
@keyframes appout{to{transform:scale(.86);opacity:0}}
.app .pad-top{height:50px;flex:none}
.hdr{flex:none;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 8px 0 6px;position:relative}
.hdr h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr.big{padding:6px 16px 4px}
.hdr.big h1{font-size:30px;letter-spacing:-.5px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.ib:active{background:rgba(0,0,0,.07)}
.ib:focus-visible,.row:focus-visible,.tab:focus-visible,.btn:focus-visible,.ap:focus-visible,.notif:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.scroll.pb{padding-bottom:34px}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(250,251,253,.96);padding-bottom:30px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:10.5px;color:var(--ink3)}
.tab.on{color:var(--ink)}
.bdg2{position:absolute;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.tab{position:relative}.tab .bdg2{left:calc(50% + 6px);top:4px}
.row .rt,.row .rs{display:block}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;background:transparent}
.row:active{background:var(--paper2)}
.row .rb{flex:1;min-width:0}
.row .rt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rr{font-size:12px;color:var(--ink3);text-align:right;flex:none}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.3px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.ubdg{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.btn{padding:11px 18px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.btn.alt{background:var(--paper2);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.empty{padding:60px 24px;text-align:center;color:var(--ink3);font-size:14px}
.tog{position:relative;width:51px;height:31px;border-radius:16px;background:#d2d6de;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog.on{background:var(--green)}
.tog.on::after{transform:translateX(20px)}

/* 바텀시트 */
#sheetHost{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheetHost .bk{position:absolute;inset:0;background:rgba(10,12,20,.45);opacity:0;transition:opacity .2s;pointer-events:auto}
#sheetHost .sh{position:absolute;left:8px;right:8px;bottom:8px;border-radius:26px;background:var(--paper);color:var(--ink);padding:10px 8px 34px;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:auto;max-height:80%;overflow:auto}
#sheetHost.open .bk{opacity:1}#sheetHost.open .sh{transform:none}
.sh .grab{width:38px;height:5px;border-radius:3px;background:#d3d7df;margin:0 auto 10px}
.sh .shr{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:14px;text-align:left;font-size:16px}
.sh .shr:active{background:var(--paper2)}
.sh .shr.red{color:var(--red)}
.sh .shh{padding:6px 16px 10px;font-weight:700;font-size:17px}
.sh .shp{padding:0 16px 8px;font-size:14px;color:var(--ink2)}

/* 라이트박스 */
#lightbox{position:absolute;inset:0;z-index:48;background:#000;display:none;flex-direction:column;color:#fff}
#lightbox.on{display:flex}
#lightbox .lb-top{padding:52px 10px 6px;display:flex;align-items:center;gap:6px}
#lightbox .lb-img{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;position:relative;touch-action:none}
#lightbox img{max-width:100%;max-height:100%;transition:transform .25s;cursor:zoom-in;user-select:none}
#lightbox img.z{cursor:zoom-out;transform:scale(2.4)}
#lightbox .lb-cap{padding:12px 18px 40px;font-size:14px;min-height:84px}
#lightbox .lb-cap b{display:block;font-size:16px}
#lightbox .lb-cap small{opacity:.7}

/* 알림 배너 / 알림 센터 */
#banner{position:absolute;left:10px;right:10px;top:50px;z-index:56;transform:translateY(-200%);transition:transform .34s cubic-bezier(.2,.9,.25,1.05);pointer-events:none}
#banner.on{transform:translateY(0);pointer-events:auto}
#banner .notif{background:rgba(30,33,46,.94);box-shadow:0 8px 28px rgba(0,0,0,.45);padding-top:12px}
#nc{z-index:44;background:rgba(10,12,24,.62);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);color:#fff;transform:translateY(-102%);transition:transform .32s cubic-bezier(.3,.7,.2,1);padding:62px 14px 60px;display:flex;flex-direction:column;gap:10px}
#nc.on{transform:none}
#nc .nch{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
#nc .nch b{font-size:22px}
#nc .nch button{font-size:13px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.14)}
#nc .nlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
#switcher{z-index:46;background:rgba(10,12,24,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:70px 0 60px;display:flex;align-items:center}
#switcher .cards{display:flex;gap:16px;overflow-x:auto;padding:0 54px;width:100%;scroll-snap-type:x mandatory;scrollbar-width:none}
.sw{flex:none;width:250px;height:480px;border-radius:26px;scroll-snap-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sw .sx{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center}
.swn{position:absolute;left:0;right:0;top:34px;text-align:center;color:#fff;font-size:13px;opacity:.75}

/* 전화 UI */
#callui{z-index:52;color:#fff;background:linear-gradient(175deg,#232848 0%,#10132a 60%,#07080f 100%);display:flex;flex-direction:column;align-items:center;padding:96px 24px 70px}
#callui .cn{font-size:34px;font-weight:600;margin-top:16px;letter-spacing:-.4px}
#callui .cs{font-size:16px;opacity:.7;margin-top:4px;font-variant-numeric:tabular-nums;min-height:22px}
#callui .ring{position:relative;display:grid;place-items:center}
#callui .ring.rg::before,#callui .ring.rg::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:pulse 1.8s ease-out infinite}
#callui .ring.rg::after{animation-delay:.9s}
@keyframes pulse{from{transform:scale(.95);opacity:.9}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){#callui .ring.rg::before,#callui .ring.rg::after{animation:none}}
#callui .cbtm{margin-top:auto;display:flex;gap:70px;justify-content:center;width:100%}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.cbtn i{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}
.cbtn.g i{background:var(--green)}.cbtn.r i{background:var(--red)}
.cbtn.m i{background:rgba(255,255,255,.16)}.cbtn.m.on i{background:#fff;color:#111}
#callui .cap{flex:1;min-height:0;width:100%;margin-top:18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;scrollbar-width:none}
.cl{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.45;animation:fadeup .3s ease}
.cl.them{align-self:flex-start;background:rgba(255,255,255,.14)}
.cl.me{align-self:flex-end;background:#3a62d8}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.copts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:10px}
.copts button{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);text-align:left;font-size:15px;color:#fff;animation:fadeup .3s ease}
.copts button:active{background:rgba(255,255,255,.22)}
#callui .mini{display:flex;gap:46px;margin-top:10px}

/* 엔딩 */
#ending{z-index:54;background:#05060b;color:#eceff7;display:flex;flex-direction:column;padding:90px 30px 70px;overflow:hidden}
#ending .tag{font-size:12px;letter-spacing:2px;color:#8f98b4;margin-bottom:10px}
#ending h2{margin:0 0 26px;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.5px}
#ending .body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;font-size:16.5px;line-height:1.75;scrollbar-width:none}
#ending .body p{margin:0;animation:fadeup .9s ease both}
#ending .foot{padding-top:14px;display:flex;flex-direction:column;gap:10px;animation:fadeup .9s ease both}
#ending .foot small{color:#8f98b4;text-align:center;font-size:12.5px}
#ending .hintt{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:12px;color:#6f7893}

/* PIN */
.pin{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:96px 28px 30px}
.pin h3{margin:0 0 6px;font-size:18px}
.pin p{margin:0 0 20px;color:var(--ink2);font-size:13.5px;min-height:20px;text-align:center}
.pin .dots{display:flex;gap:16px;margin-bottom:34px}
.pin .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.pin .dots i.f{background:var(--ink)}
.pin .dots.err{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 20px}

const CallUI = (() => {

    const cap = host().querySelector('.cap'); if (cap) setTimeout(() => cap.scrollTop = cap.scrollHeight, 30);
  }

    const k = c.state + '|' + c.who + '|' + (c.id || '');

    const ct = contactOf(c.who), name = ct.name;

    } else if (c.state === 'dialing') {
      Snd.ring(false);
      h.innerHTML = `${head}<div class="cs">발신 중…</div><div class="cbtm"><button class="cbtn r" data-c="cancel"><i>${ico('hang', 30, 1.8)}</i>취소</button></div>`;
    } else {
      Snd.ring(false);
      h.innerHTML = `<div style="display:flex;align-items:center;gap:12px;align-self:stretch;margin-top:-28px">${av(ct, 52)}<div style="text-align:left"><div style="font-size:20px;font-weight:600">${esc(name)}</div><div class="cs" id="ctimer" style="margin:0">00:00</div></div></div>
        <div class="cap" id="ccap"></div><div class="copts"></div>
        <div class="mini"><button class="cbtn m ${mute ? 'on' : ''}" data-c="mute"><i>${ico('mic', 26, 1.8)}</i>${mute ? '음소거 중' : '음소거'}</button><button class="cbtn r" data-c="hang"><i>${ico('hang', 30, 1.8)}</i>끊기</button></div>`;

/* ===== 사진 · 메모 · 캘린더 · 시계 · 설정 ===== */
const photoVisible = p => !p.req || cond(p.req, mkCtx());
const photoT = p => parseT(p.t);

/* ---------- 사진 ---------- */
const PhotosApp = (() => {
  let root = null, tab = 'library', album = null, view = null, info = false;
  const inAlbum = id => (STORY.photos || []).filter(p => (p.albums || []).includes(id) && photoVisible(p)).sort((a, b) => photoT(b) - photoT(a));
  function grid(list, aid) {
    if (!list.length) return '<div class="empty">사진이 없습니다</div>';
    return `<div class="pgrid">${list.map(p => `<button class="pcell" data-p="${p.id}" data-a="${aid}" aria-label="${esc(p.title)}"><img alt="" loading="lazy" src="${Scenes.get(p.scene)}">${S.liked[p.id] ? `<i class="lk">${icoF('heart', 13)}</i>` : ''}</button>`).join('')}</div>`;
  }
  function render() {
    root.className = 'app ph-photos';
    if (view) { renderView(); return; }
    if (album) {
      const a = STORY.albums.find(x => x.id === album); const list = inAlbum(album);
      root.innerHTML = `<div class="pad-top"></div><div class="hdr"><button class="ib" data-back aria-label="뒤로">${ico('chevL', 26, 2)}</button><h1>${esc(a.name)}</h1></div>${a.sub ? `<div style="padding:0 16px 8px;font-size:13px;color:var(--ink2)">${esc(a.sub)} · ${list.length}장</div>` : ''}<div class="scroll pb">${grid(list, album)}</div>`;
      return;
    }
    let body;
    if (tab === 'library') body = grid(inAlbum('recent'), 'recent');
    else body = `<div class="albums">${STORY.albums.map(a => { const l = inAlbum(a.id), f = l[0]; return `<button class="alb" data-album="${a.id}"><span class="thumb">${a.lock && !S.pinOk ? `<span class="lockb">${ico('lock', 30, 1.6)}</span>` : f ? `<img alt="" src="${Scenes.get(f.scene)}">` : ''}</span><b>${esc(a.name)}</b><small>${a.lock && !S.pinOk ? '잠김' : l.length + (a.sub ? ' · ' + esc(a.sub.split(' · ')[0]) : '')}</small></button>`; }).join('')}</div>`;
    root.innerHTML = `<div class="pad-top"></div><div class="hdr big"><h1>${tab === 'library' ? '보관함' : '앨범'}</h1></div><div class="scroll pb">${body}</div>
      <div class="tabbar"><button class="tab ${tab === 'library' ? 'on' : ''}" data-tab="library">${ico('photo', 24)}보관함</button><button class="tab ${tab === 'albums' ? 'on' : ''}" data-tab="albums">${ico('album', 24)}앨범</button></div>`;
  }
  function openAlbum(id) {
    const a = STORY.albums.find(x => x.id === id); if (!a) return;
    const go = () => { album = id; render(); if (a.clue) addClue(a.clue); };
    if (a.lock && !S.pinOk) Phone.pin(root, { title: a.name, sub: '숨김 앨범은 암호가 필요합니다', onOk: go }); else go();
  }
  function openPhoto(id, aid) {
    const list = aid === 'recent' || !aid ? inAlbum('recent') : inAlbum(aid); const i = list.findIndex(p => p.id === id);
    if (i < 0) return; view = { list, i, aid: aid || 'recent' }; info = false; render(); seen();
  }
  const seen = () => { const p = view.list[view.i]; if (p && p.clue) addClue(p.clue); };
  function renderView() {
    const p = view.list[view.i], t = photoT(p);
    Phone.setTone('light');
    root.innerHTML = `<div class="pview"><div class="pv-top"><button class="ib" data-vback aria-label="뒤로">${ico('chevL', 26, 2)}</button><div class="pv-t"><b>${esc(p.title)}</b><small>${fmtMD(t)} ${fmtTime(t)}</small></div></div>
      <div class="pv-img" id="pvimg"><img id="pvi" alt="${esc(p.title)}" src="${Scenes.get(p.scene)}"></div>
      ${info ? `<div class="pv-info"><div><b>${esc(p.place || '위치 정보 없음')}</b></div>${p.by ? `<div>${esc(p.by)}님이 추가함</div>` : ''}${p.caption ? `<div class="cap">“${esc(p.caption)}”</div>` : ''}${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}<div style="opacity:.55">${esc(fmtDay(t))}</div></div>` : ''}
      <div class="pv-bar"><button class="ib" data-vprev aria-label="이전" ${view.i <= 0 ? 'disabled style="opacity:.3"' : ''}>${ico('chevL', 24, 2)}</button><button class="ib ${S.liked[p.id] ? 'liked' : ''}" data-vlike aria-label="좋아요">${S.liked[p.id] ? icoF('heart', 24) : ico('heart', 24)}</button><button class="ib" data-vinfo aria-label="정보">${ico('info', 24)}</button><button class="ib" data-vnext aria-label="다음" ${view.i >= view.list.length - 1 ? 'disabled style="opacity:.3"' : ''}>${ico('chevR', 24, 2)}</button></div></div>`;
    let x0 = null; const box = root.querySelector('#pvimg'), img = root.querySelector('#pvi');
    box.addEventListener('pointerdown', e => { x0 = e.clientX; });
    box.addEventListener('pointerup', e => {
      if (x0 == null) return; const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 60 && !img.classList.contains('z')) { step(dx < 0 ? 1 : -1); return; }
      if (Math.abs(dx) < 8) { img.classList.toggle('z'); if (img.classList.contains('z')) { const r = img.getBoundingClientRect(); img.style.transformOrigin = `${clamp((e.clientX - r.left) / r.width * 100, 0, 100)}% ${clamp((e.clientY - r.top) / r.height * 100, 0, 100)}%`; } }
    });
  }
  function step(d) { const n = view.i + d; if (n < 0 || n >= view.list.length) return; view.i = n; info = false; render(); seen(); }
  function closeView() { view = null; Phone.setTone('dark'); render(); }
  function mount(r, p) {
    root = r;
    r.addEventListener('click', e => {
      const t = e.target.closest('[data-p],[data-tab],[data-album],[data-back],[data-vback],[data-vprev],[data-vnext],[data-vlike],[data-vinfo]'); if (!t) return;
      if (t.dataset.p) openPhoto(t.dataset.p, t.dataset.a);
      else if (t.dataset.tab) { tab = t.dataset.tab; render(); }
      else if (t.dataset.album) openAlbum(t.dataset.album);
      else if ('back' in t.dataset) { album = null; render(); }
      else if ('vback' in t.dataset) closeView();
      else if ('vprev' in t.dataset) step(-1);
      else if ('vnext' in t.dataset) step(1);
      else if ('vinfo' in t.dataset) { info = !info; render(); }
      else if ('vlike' in t.dataset) { const p = view.list[view.i]; likePhoto(p.id, view.aid === 'recent' ? (p.albums[0] || 'recent') : view.aid); render(); }
    });
    render();
  }
  function back() { if (view) { closeView(); return true; } if (album) { album = null; render(); return true; } return false; }
  return { mount, back, unmount() { view = null; album = null; }, tone: 'dark' };
})();
Phone.reg('photos', PhotosApp);

/* ---------- 메모 ---------- */
const NotesApp = (() => {
  let root = null, folder = null, note = null;
  const noteVisible = n => !n.req || cond(n.req, mkCtx());
  const userNotes = () => (S.userNotes = S.userNotes || []);
  const listOf = f => {
    const base = (STORY.notes || []).filter(n => n.folder === f && noteVisible(n)).map(n => ({ ...n, tt: parseT(n.t) }));
    const mine = f === '메모' ? userNotes().map(n => ({ ...n, mine: true, tt: n.t })) : [];
    return base.concat(mine).sort((a, b) => b.tt - a.tt);
  };
  const folders = () => { const names = []; (STORY.notes || []).forEach(n => { if (!names.includes(n.folder)) names.push(n.folder); }); if (!names.includes('메모')) names.unshift('메모'); return names; };
  const isLockedF = f => (STORY.notes || []).some(n => n.folder === f && n.locked);
  function render() {
    root.className = 'app ph-notes';
    if (note) { renderNote(); return; }
    if (folder == null) {
      root.innerHTML = `<div class="pad-top"></div><div class="hdr big"><h1>폴더</h1></div><div class="scroll pb"><div class="grp">${folders().map(f => `<button class="row" data-f="${esc(f)}"><span style="color:#e7a500">${ico(isLockedF(f) ? 'lock' : 'book', 22, 1.8)}</span><span class="rb"><span class="rt" style="font-weight:500">${esc(f)}</span></span><span class="rr" style="font-size:14px">${isLockedF(f) && !S.pinOk ? '' : listOf(f).length} ${ico('chevR', 15, 2)}</span></button>`).join('')}</div></div>`;
      return;
    }
    const L = listOf(folder);
    root.innerHTML = `<div class="pad-top"></div><div class="hdr"><button class="ib" data-fb aria-label="폴더">${ico('chevL', 26, 2)}</button><h1>${esc(folder)}</h1>${folder === '메모' ? `<button class="ib" data-new aria-label="새 메모">${ico('compose', 22, 1.9)}</button>` : ''}</div>
      <div class="scroll pb"><div class="grp">${L.length ? L.map(n => `<button class="row" data-n="${n.id}" style="flex-direction:column;align-items:stretch;gap:2px"><span class="rt">${esc(n.title || '새로운 메모')}</span><span class="rs"><span style="color:var(--ink3);margin-right:8px">${fmtMD(n.tt)}</span>${esc((n.body || '').split('\n').filter(Boolean)[0] || '추가 텍스트 없음')}</span></button>`).join('') : '<div class="empty">메모가 없습니다</div>'}</div></div>`;
  }
  function renderNote() {
    const n = note.mine ? userNotes().find(x => x.id === note.id) : STORY.notes.find(x => x.id === note.id); if (!n) { note = null; render(); return; }
    if (note.mine) {
      root.innerHTML = `<div class="pad-top"></div><div class="hdr"><button class="ib" data-nb aria-label="뒤로">${ico('chevL', 26, 2)}</button><h1 style="font-size:14px;color:var(--ink3);font-weight:500">${fmtDay(n.t)}</h1><button class="ib" data-del aria-label="삭제">${ico('trash', 21, 1.8)}</button></div><textarea id="nta" class="nta" placeholder="메모를 입력하세요" aria-label="메모 내용">${esc(n.body || '')}</textarea>`;
      const ta = root.querySelector('#nta'); ta.addEventListener('input', () => { n.body = ta.value; n.title = (ta.value.split('\n')[0] || '').slice(0, 30); save(); });
      if (!n.body) ta.focus();
      return;
    }
    root.innerHTML = `<div class="pad-top"></div><div class="hdr"><button class="ib" data-nb aria-label="뒤로">${ico('chevL', 26, 2)}</button><h1 style="font-size:14px;color:var(--ink3);font-weight:500;text-align:center">${fmtDay(parseT(n.t))}</h1><span style="width:40px"></span></div><div class="scroll pb"><div class="ndoc"><h2>${esc(n.title)}</h2><div class="nbody">${brLines(n.body)}</div></div></div>`;
  }
  function openNote(id, mine) {
    const n = mine ? userNotes().find(x => x.id === id) : STORY.notes.find(x => x.id === id); if (!n) return;
    const go = () => { note = { id, mine }; render(); if (n.clue) addClue(n.clue); };
    if (n.locked && !S.pinOk) Phone.pin(root, { title: '잠긴 메모', sub: '이 메모는 암호로 보호되어 있습니다', onOk: go }); else go();
  }
  function mount(r, p) {
    root = r;
    r.addEventListener('click', e => {
      const t = e.target.closest('[data-f],[data-fb],[data-n],[data-nb],[data-new],[data-del]'); if (!t) return;
      if (t.dataset.f != null) { const f = t.dataset.f; if (isLockedF(f) && !S.pinOk) Phone.pin(root, { title: '잠긴 메모', sub: '암호를 입력하세요', onOk: () => { folder = f; render(); } }); else { folder = f; render(); } }
      else if ('fb' in t.dataset) { folder = null; render(); }
      else if (t.dataset.n) { const un = userNotes().find(x => x.id === t.dataset.n); openNote(t.dataset.n, !!un); }
      else if ('nb' in t.dataset) { if (note && note.mine) { const n = userNotes().find(x => x.id === note.id); if (n && !n.body.trim()) S.userNotes = userNotes().filter(x => x !== n); } note = null; render(); }
      else if ('new' in t.dataset) { const n = { id: 'u' + uid(), title: '', body: '', t: S.now }; userNotes().push(n); save(); note = { id: n.id, mine: true }; render(); }
      else if ('del' in t.dataset) { S.userNotes = userNotes().filter(x => x.id !== note.id); save(); note = null; render(); }
    });
    render();
  }
  function back() { if (note) { note = null; render(); return true; } if (folder != null) { folder = null; render(); return true; } return false; }
  return { mount, back, unmount() { note = null; folder = null; }, tone: 'dark' };
})();
Phone.reg('notes', NotesApp);

/* ---------- 캘린더 ---------- */
const CalendarApp = (() => {
  let root = null, y = YEAR, m = 9, sel = null, open = {};
  const mmdd = (mm, dd) => String(mm + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
  const evOn = (mm, dd) => (STORY.calendar || []).filter(e => evVisible(e) && e.date === mmdd(mm, dd)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  function render() {
    root.className = 'app ph-cal';
    const today = new Date(S.now); if (sel == null) { y = today.getFullYear(); m = today.getMonth(); sel = today.getDate(); }
    const first = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate();
    let cells = ''; for (let i = 0; i < first; i++) cells += '<span></span>';
    for (let d = 1; d <= dim; d++) {
      const ev = evOn(m, d), isT = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
      cells += `<button class="cd ${isT ? 'today' : ''} ${sel === d ? 'sel' : ''}" data-d="${d}" aria-label="${m + 1}월 ${d}일 ${ev.length ? '일정 ' + ev.length + '개' : ''}"><b>${d}</b><span class="dots">${ev.slice(0, 3).map(e => `<i style="background:${e.color || '#999'}"></i>`).join('')}</span></button>`;
    }
    const evs = sel ? evOn(m, sel) : [];
    root.innerHTML = `<div class="pad-top"></div><div class="hdr"><button class="ib" data-mv="-1" aria-label="이전 달">${ico('chevL', 24, 2)}</button><h1 style="text-align:center">${y}년 ${m + 1}월</h1><button class="ib" data-mv="1" aria-label="다음 달">${ico('chevR', 24, 2)}</button></div>
      <div class="cwk">${DOW.map((d, i) => `<span style="color:${i === 0 ? 'var(--red)' : i === 6 ? 'var(--blue)' : 'var(--ink3)'}">${d}</span>`).join('')}</div><div class="cgrid">${cells}</div>
      <div class="scroll pb cev"><div class="sec" style="padding-top:12px">${m + 1}월 ${sel || ''}일 ${sel ? DOW[new Date(y, m, sel).getDay()] + '요일' : ''}</div>
      ${evs.length ? evs.map(e => `<button class="evr" data-e="${e.id}"><i style="background:${e.color || '#999'}"></i><span class="rb"><span class="rt">${esc(e.title)}</span><span class="rs">${esc([e.time, e.place].filter(Boolean).join(' · ') || '종일')}</span>${open[e.id] && e.note ? `<span class="en">${esc(e.note)}</span>` : ''}</span>${e.note ? `<span style="color:var(--ink3)">${ico(open[e.id] ? 'chevD' : 'chevR', 16, 2)}</span>` : ''}</button>`).join('') : '<div class="empty" style="padding:26px">일정이 없습니다</div>'}</div>`;
  }
  function mount(r) {
    root = r;
    r.addEventListener('click', e => {
      const t = e.target.closest('[data-d],[data-mv],[data-e]'); if (!t) return;
      if (t.dataset.d) { sel = +t.dataset.d; render(); }
      else if (t.dataset.mv) { m += +t.dataset.mv; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } sel = null; const td = new Date(S.now); if (td.getFullYear() === y && td.getMonth() === m) sel = td.getDate(); else sel = 1; render(); }
      else if (t.dataset.e) { const ev = STORY.calendar.find(x => x.id === t.dataset.e); open[ev.id] = !open[ev.id]; render(); if (ev.clue) addClue(ev.clue); }
    });
    render();
  }
  return { mount, unmount() { sel = null; open = {}; }, tone: 'dark' };
})();
Phone.reg('calendar', CalendarApp);

/* ---------- 시계 ---------- */
const ClockApp = (() => {
  let root = null, tab = 'alarm', sw = { run: false, t0: 0, acc: 0, laps: [] }, swT = 0;
  const alarmOn = a => S.alarms[a.id] != null ? S.alarms[a.id] : a.on;
  const fmtSw = ms => { const t = Math.floor(ms / 10), cs = t % 100, s = Math.floor(t / 100) % 60, mi = Math.floor(t / 6000); return `${String(mi).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`; };
  const swNow = () => sw.acc + (sw.run ? Date.now() - sw.t0 : 0);
  function render() {
    root.className = 'app ph-clock'; clearInterval(swT);
    let body;
    if (tab === 'alarm') {
      body = (STORY.clockApp.alarms || []).map(a => { const on = alarmOn(a), [h, mi] = a.time.split(':').map(Number); const ap = h < 12 ? '오전' : '오후';
        return `<div class="alr"><button class="alb2" data-al="${a.id}"><span class="at" style="opacity:${on ? 1 : .4}"><small>${ap}</small>${(h % 12 || 12)}:${String(mi).padStart(2, '0')}</span><span class="al" style="opacity:${on ? 1 : .5}">${esc(a.label)}, ${esc(a.repeat)}</span></button><button class="tog ${on ? 'on' : ''}" data-tgl="${a.id}" role="switch" aria-checked="${on}" aria-label="알람 ${a.time}"></button></div>`; }).join('');
    } else {
      body = `<div class="swd" id="swd">${fmtSw(swNow())}</div><div class="swb"><button class="cbtn m" data-swc="lap" style="color:var(--ink)"><i style="background:var(--paper2)">${sw.run ? '랩' : '리셋'}</i></button><button class="cbtn" data-swc="go"><i style="background:${sw.run ? 'var(--red)' : 'var(--green)'};color:#fff">${sw.run ? '정지' : '시작'}</i></button></div>
        <div>${sw.laps.map((l, i) => `<div class="row" style="justify-content:space-between"><span>랩 ${sw.laps.length - i}</span><span style="font-variant-numeric:tabular-nums">${fmtSw(l)}</span></div>`).join('')}</div>`;
    }
    root.innerHTML = `<div class="pad-top"></div><div class="hdr big"><h1>${tab === 'alarm' ? '알람' : '스톱워치'}</h1></div><div class="scroll pb">${body}</div>
      <div class="tabbar"><button class="tab ${tab === 'alarm' ? 'on' : ''}" data-tab="alarm">${ico('clock', 24)}알람</button><button class="tab ${tab === 'sw' ? 'on' : ''}" data-tab="sw">${ico('stop', 24)}스톱워치</button></div>`;
    if (tab === 'sw' && sw.run) swT = setInterval(() => { const d = root && root.querySelector('#swd'); if (d) d.textContent = fmtSw(swNow()); }, 50);
  }
  function mount(r) {
    root = r;
    r.addEventListener('click', e => {
      const t = e.target.closest('[data-tab],[data-al],[data-tgl],[data-swc]'); if (!t) return;
      if (t.dataset.tab) { tab = t.dataset.tab; render(); }
      else if (t.dataset.tgl) { const a = STORY.clockApp.alarms.find(x => x.id === t.dataset.tgl); S.alarms[a.id] = !alarmOn(a); save(); render(); }
      else if (t.dataset.al) {
        const a = STORY.clockApp.alarms.find(x => x.id === t.dataset.al), [h, mi] = a.time.split(':').map(Number);
        Phone.sheet(`<div class="shh">알람 편집</div><div style="padding:0 16px 8px;font-size:44px;font-weight:300;font-variant-numeric:tabular-nums">${a.time}</div><div class="shp">레이블 · ${esc(a.label)}<br>반복 · ${esc(a.repeat)}</div>`, {});
        if (a.clue) addClue(a.clue);
      } else if (t.dataset.swc === 'go') { if (sw.run) { sw.acc += Date.now() - sw.t0; sw.run = false; } else { sw.t0 = Date.now(); sw.run = true; } render(); }
      else if (t.dataset.swc === 'lap') { if (sw.run) sw.laps.unshift(swNow()); else { sw = { run: false, t0: 0, acc: 0, laps: [] }; } render(); }
    });
    render();
  }
  return { mount, unmount() { clearInterval(swT); }, tone: 'dark' };
})();
Phone.reg('clock', ClockApp);

/* ---------- 설정 ---------- */
const SettingsApp = (() => {
  let root = null, stack = [];
  const tg = (k, on, label) => `<button class="tog ${on ? 'on' : ''}" data-tg="${k}" role="switch" aria-checked="${on}" aria-label="${label}"></button>`;
  const link = (k, icon, bg, label, val) => `<button class="row" data-go="${k}"><span class="si" style="background:${bg}">${ico(icon, 18, 1.9)}</span><span class="rb"><span class="rt" style="font-weight:500">${label}</span></span><span class="rr" style="font-size:14px;display:flex;gap:4px;align-items:center">${val || ''}${ico('chevR', 15, 2)}</span></button>`;
  function render() {
    root.className = 'app ph-set';
    const v = stack[stack.length - 1] || 'main', set = S.settings;
    let head = '설정', body = '';
    if (v === 'main') {
      body = `<div class="grp"><div class="row" style="cursor:default"><span class="av" style="width:56px;height:56px;background:#4b5a7a;font-size:20px">${esc(STORY.meta.playerName.slice(1))}</span><span class="rb"><span class="rt" style="font-size:18px">${esc(STORY.meta.playerName)}</span><span class="rs">Apple ID, 기기, 위치</span></span></div></div>

  function go(entry) { stack = stack.slice(0, idx + 1); stack.push(entry); idx = stack.length - 1; render(); onEnter(entry); }

      S.visits = (S.visits || []).filter(v => v.page !== p.id); S.visits.unshift({ id: uid(), t: S.now, title: p.title, page: p.id }); save();

  const secData = () => `<h3>데이터</h3><p class="hint">현재 편집본 전체입니다. 복사해 두면 백업이 됩니다. 붙여넣고 "가져오기"를 누르면 편집본을 통째로 바꿉니다.</p>

  function parseVal(el) {
    const k = el.dataset.k;

    if (k === 'lines') return el.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (k === 'seqs') return textToSeqs(el.value);
